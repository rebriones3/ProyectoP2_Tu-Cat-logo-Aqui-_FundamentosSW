<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../img/logos/LOGO-removebg-preview.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <title>Crear Cuenta</title>
  </head>

  <body>

    <main>

      <!-- CARD BOOTSTRAP: formulario de registro -->
      <div class="card tarjeta-registro">
        <div class="card-body">
          <figure>
            <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" alt="logo" width="60" />
          </figure>
          <h1>Crear Cuenta</h1>
          <p>Empieza a vender hoy mismo</p>

          <form action="admin.html" method="post">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" type="text" placeholder="Juan Pérez" required />

            <label for="negocio">Nombre del negocio</label>
            <input id="negocio" name="negocio" type="text" placeholder="Mi Boutique" />

            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" required />

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />

            <label for="confirmar">Confirmar contraseña</label>
            <input id="confirmar" name="confirmar" type="password" placeholder="••••••••" required />

            <button type="submit" title="Crear Cuenta">Crear Cuenta</button>
          </form>

          <hr />

          <p class="enlace-login">
            ¿Ya tienes cuenta? <a href="login.html" title="Iniciar Sesión">Inicia sesión</a>
          </p>
        </div>
      </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
