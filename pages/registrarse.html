<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../img/logos/LOGO-removebg-preview.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/registrarse.css" />
    <title>Crear Cuenta</title>
  </head>

  <body>

    <main>

      <!-- Tarjeta del formulario de registro -->
      <section class="tarjeta-registro">
        <figure>
          <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" alt="logo" width="60" />
        </figure>
        <h1>Crear Cuenta</h1>
        <p>Empieza a vender hoy mismo</p>

        <!-- Formulario de registro -->
        <form action="admin.html" method="post">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" placeholder="Juan Pérez" required />

          <label for="negocio">Nombre del negocio</label>
          <input id="negocio" name="negocio" type="text" placeholder="Mi Boutique" />

          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" required />

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />

          <label for="confirmar">Confirmar contraseña</label>
          <input id="confirmar" name="confirmar" type="password" placeholder="••••••••" required />

          <button type="submit" title="Crear Cuenta">Crear Cuenta</button>
        </form>

        <hr />

        <!-- Enlace para ir al login -->
        <p class="enlace-login">
          ¿Ya tienes cuenta? <a href="login.html" title="Iniciar Sesión">Inicia sesión</a>
        </p>
      </section>

    </main>

  </body>
</html>
