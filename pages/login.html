<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link
      href="../img/logos/LOGO-removebg-preview.png"
      rel="icon"
      type="image/png"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="../css/general.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <section>
        <figure>
          <img alt="logo" src="../img/logos/logo.png" width="70" />
        </figure>
        <h1>Panel de Administración</h1>
        <p>Gestiona tu catálogo digital</p>
        <form action="admin.html" method="post">
          <label for="correo">Correo electrónico:</label>
          <br /><br />
          <input
            id="correo"
            name="correo"
            placeholder="correo@ejemplo.com"
            required=""
            type="email"
          />
          <br /><br />
          <label for="contraseña">Contraseña:</label>
          <br /><br />
          <input
            id="contraseña"
            name="contraseña"
            placeholder="••••••••"
            required=""
            type="password"
          />
          <br /><br />
          <input id="recordar" name="recordar" type="checkbox" />
          <label for="recordar"> Recordarme </label>
          <br /><br />
          <button title="Iniciar Sesión" type="submit">Iniciar Sesión</button>
        </form>
        <hr />
        <section>
          <label> ¿No tienes cuenta? </label>
          <a href="registrarse.html"> Regístrate aquí </a>
        </section>
      </section>
      <aside>
        <a href="../index.html"> ← Volver al inicio </a>
      </aside>
    </main>
  </body>
</html>
