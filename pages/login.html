<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../img/logos/LOGO-removebg-preview.png" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/general.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <title>Iniciar Sesión</title>
  </head>

  <body>

    <main>

      <!-- CARD BOOTSTRAP: formulario de login -->
      <div class="card tarjeta-login">
        <div class="card-body">
          <figure>
            <img src="../img/logos/logo.png" alt="logo" width="70" />
          </figure>
          <h1>Panel de Administración</h1>
          <p>Gestiona tu catálogo digital</p>

          <form action="admin.html" method="post">
            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" required />

            <label for="contraseña">Contraseña</label>
            <input id="contraseña" name="contraseña" type="password" placeholder="••••••••" required />

            <div class="recordar-sesion">
              <input id="recordar" name="recordar" type="checkbox" />
              <label for="recordar">Recordarme</label>
            </div>

            <button type="submit" title="Iniciar Sesión">Iniciar Sesión</button>
          </form>

          <hr />

          <p class="enlace-registro">
            ¿No tienes cuenta? <a href="registrarse.html">Regístrate aquí</a>
          </p>
        </div>
      </div>

      <aside class="volver-inicio">
        <a href="../index.html">← Volver al inicio</a>
      </aside>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
